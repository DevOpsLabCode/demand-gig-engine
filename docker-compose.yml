# Author: Stan Zvenigorodskiy | DevOps Lab Inc. | https://DevOpsLabInc.com
# Purpose: Defines the local PostgreSQL, Django, and React/Nginx stack, including health dependencies, environment boundaries, persistent data, and developer ports.
# Comments explain each service role, dependency boundary, persistent volume, and developer-facing port.

services:
  # PostgreSQL persists campaign, pledge, sponsor, user, and integration records for the local stack.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demandgig
      POSTGRES_USER: demandgig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - demandgig_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandgig"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Django applies migrations after PostgreSQL is healthy, then exposes the REST and authentication APIs.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://demandgig:${POSTGRES_PASSWORD}@db:5432/demandgig
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      LOGIN_REDIRECT_URL: http://localhost:5173
      SOCIAL_AUTH_ALLOWED_PROVIDERS: ${SOCIAL_AUTH_ALLOWED_PROVIDERS:-google,facebook,instagram,tiktok}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      INSTAGRAM_OAUTH_CLIENT_ID: ${INSTAGRAM_OAUTH_CLIENT_ID:-}
      INSTAGRAM_OAUTH_CLIENT_SECRET: ${INSTAGRAM_OAUTH_CLIENT_SECRET:-}
      TIKTOK_OAUTH_CLIENT_KEY: ${TIKTOK_OAUTH_CLIENT_KEY:-}
      TIKTOK_OAUTH_CLIENT_SECRET: ${TIKTOK_OAUTH_CLIENT_SECRET:-}
      REDIS_URL: ${REDIS_URL:-}
      PAYMENT_PROVIDER: fake
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # The production-style Nginx image serves the compiled React UI and points browser API calls at the local backend.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: http://localhost:8000/api
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  # Named storage keeps PostgreSQL data across container recreation during development.
  demandgig_db:
