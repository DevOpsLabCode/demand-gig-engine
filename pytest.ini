# Author: Stan Zvenigorodskiy | DevOps Lab Inc. | https://DevOpsLabInc.com
# Purpose: Configures pytest discovery, Django settings, strictness, coverage measurement, and the 90% quality gate.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = backend
testpaths = backend
python_files = test_*.py *_tests.py tests.py
addopts = --strict-markers --strict-config --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90
