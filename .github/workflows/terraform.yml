# Author: Stan Zvenigorodskiy | DevOps Lab Inc. | https://DevOpsLabInc.com
# Purpose: Validates Terraform, provisions account-level controls, creates
# protected remote-state backends, plans and deploys development, optionally
# destroys development after a configurable delay, and deploys production
# only from a published GitHub Release.

name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "Dockerfile.backend"
      - "Dockerfile.frontend"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "Dockerfile.backend"
      - "Dockerfile.frontend"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      operation:
        description: "Select the development operation"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

      auto_destroy:
        description: "Destroy development automatically after deployment"
        required: true
        default: true
        type: boolean

      destroy_after_minutes:
        description: "Minutes to keep development running before automatic destroy"
        required: true
        default: "30"
        type: string

  # Production deployment occurs only from a published GitHub Release.
  release:
    types:
      - published

# Static IAM credentials do not require GitHub OIDC token permission.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.8"
  AWS_REGION: "us-east-1"

jobs:
  validate:
    name: Terraform validation and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: terraform/tests/go.mod

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Normalize and validate Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform fmt -check -recursive -diff

          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

          terraform -chdir=terraform/global/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/global/bootstrap validate

          terraform -chdir=terraform/global/account init -backend=false -input=false
          terraform -chdir=terraform/global/account validate

      - name: Validate Terraform helper scripts
        shell: bash
        run: |
          set -euo pipefail

          bash -n terraform/scripts/bootstrap.sh
          bash -n terraform/scripts/bootstrap-account.sh
          bash -n terraform/scripts/deploy.sh
          bash -n terraform/scripts/reconcile-rds-service-linked-role.sh
          bash -n terraform/scripts/reconcile-elasticache-service-linked-role.sh

      - name: Run TFLint
        run: tflint --chdir=terraform --recursive

      - name: Validate Terraform module contracts
        run: python scripts/validate_terraform_module_contracts.py

      - name: Run Go contract tests
        working-directory: terraform/tests
        run: go test -race -count=1 -v ./...

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

  plan:
    name: Development plan

    # The security validator requires this exact trusted-main invariant.
    # Manual deployment performs its own plan through deploy.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify development AWS secrets
        shell: bash
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ACCESS_KEY_ID}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is missing or unavailable."
            exit 1
          fi

          if [[ -z "${SECRET_ACCESS_KEY}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is missing or unavailable."
            exit 1
          fi

          echo "Development AWS credential secrets are available."

      - name: Configure development AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          force-skip-oidc: true
          unset-current-credentials: true
          disable-retry: true
          mask-aws-account-id: true

      - name: Verify development AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Bootstrap development remote backend
        shell: bash
        env:
          CREATE_BACKEND: "true"
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap.sh dev

      - name: Bootstrap account-foundation backend
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap-account.sh

      - name: Initialize account foundation
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "terraform/global/account/backend.hcl" ]]; then
            echo "::error::terraform/global/account/backend.hcl was not generated."
            exit 1
          fi

          terraform -chdir=terraform/global/account init \
            -input=false \
            -reconfigure \
            -backend-config=backend.hcl

      - name: Reconcile RDS service-linked role
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/reconcile-rds-service-linked-role.sh reconcile
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh reconcile

      - name: Apply account foundation
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform/global/account apply \
            -input=false \
            -auto-approve

          ./terraform/scripts/reconcile-rds-service-linked-role.sh verify
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh verify

      - name: Verify account foundation
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn \
            "arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"

          DETECTOR_ID="$(
            aws guardduty list-detectors \
              --region "${AWS_REGION}" \
              --query 'DetectorIds[0]' \
              --output text
          )"

          if [[ -z "${DETECTOR_ID}" || "${DETECTOR_ID}" == "None" ]]; then
            echo "::error::GuardDuty detector is not available in ${AWS_REGION}."
            exit 1
          fi

          echo "GitHub OIDC provider is available."
          echo "GuardDuty detector: ${DETECTOR_ID}"

      - name: Initialize development remote state
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "terraform/envs/dev/backend.hcl" ]]; then
            echo "::error::terraform/envs/dev/backend.hcl was not generated."
            exit 1
          fi

          terraform -chdir=terraform init \
            -input=false \
            -reconfigure \
            -backend-config=envs/dev/backend.hcl

      - name: Create Terraform plan
        id: terraform-plan
        shell: bash
        run: |
          set -uo pipefail

          PLAN_LOG="terraform/dev-plan.log"
          PLAN_FILE="dev.tfplan"

          rm -f "${PLAN_LOG}"
          rm -f "terraform/${PLAN_FILE}"

          set +e

          terraform -chdir=terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out="${PLAN_FILE}" \
            -var-file=envs/dev/terraform.tfvars \
            -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim" \
            2>&1 | tee "${PLAN_LOG}"

          PLAN_EXIT_CODE="${PIPESTATUS[0]}"

          set -e

          echo "exit_code=${PLAN_EXIT_CODE}" >> "${GITHUB_OUTPUT}"

          if [[ "${PLAN_EXIT_CODE}" -ne 0 ]]; then
            echo "::group::Terraform error details"

            awk '
              /^Error:/ {
                capture = 1
              }

              capture {
                print
              }
            ' "${PLAN_LOG}" || true

            echo "::endgroup::"
            echo "::error::Terraform plan failed with exit code ${PLAN_EXIT_CODE}."
            echo "::error::Download terraform-dev-diagnostics for the complete log."

            exit "${PLAN_EXIT_CODE}"
          fi

          echo "Terraform plan completed successfully."

      - name: Render plan summary
        if: steps.terraform-plan.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform show \
            -no-color \
            dev.tfplan > terraform/dev-plan.txt

      - name: Upload Terraform plan
        if: steps.terraform-plan.outputs.exit_code == '0'
        uses: actions/upload-artifact@v6
        with:
          name: terraform-dev-plan
          path: |
            terraform/dev.tfplan
            terraform/dev-plan.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload Terraform diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terraform-dev-diagnostics
          path: terraform/dev-plan.log
          retention-days: 14
          if-no-files-found: warn

  deploy-dev:
    name: Deploy development

    # Main-branch pushes deploy only after the trusted plan succeeds. Manual
    # operation=deploy runs deploy.sh directly after validation. always() is
    # required so a skipped push-only plan does not block a manual deployment.
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main' &&
         vars.DEV_AUTO_DEPLOY != 'false' &&
         needs.plan.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.operation == 'deploy')
      )

    needs:
      - validate
      - plan

    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify development AWS secrets
        shell: bash
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ACCESS_KEY_ID}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is missing or unavailable."
            exit 1
          fi

          if [[ -z "${SECRET_ACCESS_KEY}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is missing or unavailable."
            exit 1
          fi

          echo "Development AWS credential secrets are available."

      - name: Configure development AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          force-skip-oidc: true
          unset-current-credentials: true
          disable-retry: true
          mask-aws-account-id: true

      - name: Verify development AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Ensure development backend exists
        shell: bash
        env:
          CREATE_BACKEND: "true"
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap.sh dev

      - name: Ensure account-foundation backend exists
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap-account.sh

      - name: Initialize and apply account foundation
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform/global/account init \
            -input=false \
            -reconfigure \
            -backend-config=backend.hcl

          ./terraform/scripts/reconcile-rds-service-linked-role.sh reconcile
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh reconcile

          terraform -chdir=terraform/global/account apply \
            -input=false \
            -auto-approve

          ./terraform/scripts/reconcile-rds-service-linked-role.sh verify
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh verify

      - name: Build, migrate, and deploy development
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/deploy.sh dev

      - name: Record development deployment settings
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_AUTO_DESTROY: ${{ inputs.auto_destroy }}
          MANUAL_DESTROY_AFTER_MINUTES: ${{ inputs.destroy_after_minutes }}
          CONFIGURED_AUTO_DESTROY: ${{ vars.DEV_AUTO_DESTROY }}
          CONFIGURED_DESTROY_AFTER_MINUTES: ${{ vars.DEV_DESTROY_AFTER_MINUTES }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            AUTO_DESTROY="${MANUAL_AUTO_DESTROY:-true}"
            DESTROY_AFTER_MINUTES="${MANUAL_DESTROY_AFTER_MINUTES:-30}"
          else
            AUTO_DESTROY="${CONFIGURED_AUTO_DESTROY:-true}"
            DESTROY_AFTER_MINUTES="${CONFIGURED_DESTROY_AFTER_MINUTES:-30}"
          fi

          {
            echo "## Development deployment"
            echo
            echo "- Operation: deploy"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Automatic destroy: ${AUTO_DESTROY}"
            echo "- Destroy delay: ${DESTROY_AFTER_MINUTES} minutes"
          } >> "${GITHUB_STEP_SUMMARY}"

  auto-destroy-dev:
    name: Auto-destroy development

    if: >-
      needs.deploy-dev.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main' &&
         vars.DEV_AUTO_DESTROY != 'false') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.operation == 'deploy' &&
         inputs.auto_destroy == true)
      )

    needs:
      - deploy-dev

    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: dev

    permissions:
      contents: read

    steps:
      - name: Validate automatic destroy delay
        id: delay
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DESTROY_AFTER_MINUTES: ${{ inputs.destroy_after_minutes }}
          CONFIGURED_DESTROY_AFTER_MINUTES: ${{ vars.DEV_DESTROY_AFTER_MINUTES }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            DESTROY_AFTER_MINUTES="${MANUAL_DESTROY_AFTER_MINUTES:-30}"
          else
            DESTROY_AFTER_MINUTES="${CONFIGURED_DESTROY_AFTER_MINUTES:-30}"
          fi

          if [[ ! "${DESTROY_AFTER_MINUTES}" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy_after_minutes must be a whole number."
            exit 1
          fi

          if (( DESTROY_AFTER_MINUTES < 5 || DESTROY_AFTER_MINUTES > 240 )); then
            echo "::error::destroy_after_minutes must be between 5 and 240."
            exit 1
          fi

          echo "minutes=${DESTROY_AFTER_MINUTES}" >> "${GITHUB_OUTPUT}"

      - name: Wait before destroying development
        shell: bash
        env:
          DESTROY_AFTER_MINUTES: ${{ steps.delay.outputs.minutes }}
        run: |
          set -euo pipefail

          DESTROY_AFTER_SECONDS="$((DESTROY_AFTER_MINUTES * 60))"

          echo "Development will be destroyed in ${DESTROY_AFTER_MINUTES} minutes."
          echo "Do not cancel this workflow while automatic destroy is enabled."

          sleep "${DESTROY_AFTER_SECONDS}"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure development AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          force-skip-oidc: true
          unset-current-credentials: true
          disable-retry: true
          mask-aws-account-id: true

      - name: Verify development AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Resolve existing development backend
        shell: bash
        env:
          CREATE_BACKEND: "false"
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap.sh dev

      - name: Initialize development remote state
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "terraform/envs/dev/backend.hcl" ]]; then
            echo "::error::terraform/envs/dev/backend.hcl was not generated."
            exit 1
          fi

          terraform -chdir=terraform init \
            -input=false \
            -reconfigure \
            -backend-config=envs/dev/backend.hcl

      - name: Destroy development infrastructure
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform destroy \
            -input=false \
            -auto-approve \
            -lock-timeout=5m \
            -var-file=envs/dev/terraform.tfvars \
            -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim"

      - name: Verify no development resources remain
        shell: bash
        run: |
          set -uo pipefail

          VERIFY_LOG="terraform/dev-destroy-verification.log"

          set +e

          terraform -chdir=terraform plan \
            -destroy \
            -detailed-exitcode \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -var-file=envs/dev/terraform.tfvars \
            -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim" \
            > "${VERIFY_LOG}" 2>&1

          VERIFY_EXIT_CODE="$?"

          set -e

          cat "${VERIFY_LOG}"

          if [[ "${VERIFY_EXIT_CODE}" -eq 2 ]]; then
            echo "::error::Terraform still finds development resources to destroy."
            exit 1
          fi

          if [[ "${VERIFY_EXIT_CODE}" -ne 0 ]]; then
            echo "::error::Terraform destroy verification failed."
            exit "${VERIFY_EXIT_CODE}"
          fi

          echo "No development workload resources remain."

      - name: Record automatic destroy result
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Development automatic destroy"
            echo
            echo "- Delay: ${{ steps.delay.outputs.minutes }} minutes"
            echo "- Result: development workload destroyed"
            echo "- Preserved: remote-state backend and account foundation"
          } >> "${GITHUB_STEP_SUMMARY}"

  destroy-dev:
    name: Destroy development manually

    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy'

    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure development AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          force-skip-oidc: true
          unset-current-credentials: true
          disable-retry: true
          mask-aws-account-id: true

      - name: Verify development AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Resolve existing development backend
        shell: bash
        env:
          CREATE_BACKEND: "false"
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap.sh dev

      - name: Initialize development remote state
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "terraform/envs/dev/backend.hcl" ]]; then
            echo "::error::terraform/envs/dev/backend.hcl was not generated."
            exit 1
          fi

          terraform -chdir=terraform init \
            -input=false \
            -reconfigure \
            -backend-config=envs/dev/backend.hcl

      - name: Destroy development infrastructure
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform destroy \
            -input=false \
            -auto-approve \
            -lock-timeout=5m \
            -var-file=envs/dev/terraform.tfvars \
            -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim"

      - name: Verify no development resources remain
        shell: bash
        run: |
          set -uo pipefail

          VERIFY_LOG="terraform/dev-destroy-verification.log"

          set +e

          terraform -chdir=terraform plan \
            -destroy \
            -detailed-exitcode \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -var-file=envs/dev/terraform.tfvars \
            -var="backend_image=public.ecr.aws/docker/library/python:3.12-slim" \
            > "${VERIFY_LOG}" 2>&1

          VERIFY_EXIT_CODE="$?"

          set -e

          cat "${VERIFY_LOG}"

          if [[ "${VERIFY_EXIT_CODE}" -eq 2 ]]; then
            echo "::error::Terraform still finds development resources to destroy."
            exit 1
          fi

          if [[ "${VERIFY_EXIT_CODE}" -ne 0 ]]; then
            echo "::error::Terraform destroy verification failed."
            exit "${VERIFY_EXIT_CODE}"
          fi

          echo "No development workload resources remain."

  deploy-prod:
    name: Deploy production

    if: github.event_name == 'release' && github.event.action == 'published'

    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify production AWS secrets
        shell: bash
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ACCESS_KEY_ID}" ]]; then
            echo "::error::AWS_PROD_ACCESS_KEY_ID is missing or unavailable."
            exit 1
          fi

          if [[ -z "${SECRET_ACCESS_KEY}" ]]; then
            echo "::error::AWS_PROD_SECRET_ACCESS_KEY is missing or unavailable."
            exit 1
          fi

          echo "Production AWS credential secrets are available."

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          force-skip-oidc: true
          unset-current-credentials: true
          disable-retry: true
          mask-aws-account-id: true

      - name: Verify production AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Ensure production backend exists
        shell: bash
        env:
          CREATE_BACKEND: "true"
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap.sh prod

      - name: Ensure account-foundation backend exists
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/bootstrap-account.sh

      - name: Initialize and apply account foundation
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=terraform/global/account init \
            -input=false \
            -reconfigure \
            -backend-config=backend.hcl

          ./terraform/scripts/reconcile-rds-service-linked-role.sh reconcile
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh reconcile

          terraform -chdir=terraform/global/account apply \
            -input=false \
            -auto-approve

          ./terraform/scripts/reconcile-rds-service-linked-role.sh verify
          ./terraform/scripts/reconcile-elasticache-service-linked-role.sh verify

      - name: Build, migrate, and deploy production
        shell: bash
        run: |
          set -euo pipefail
          ./terraform/scripts/deploy.sh prod
