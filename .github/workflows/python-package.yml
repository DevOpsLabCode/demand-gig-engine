# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Verify Django test environment
        run: |
          python -c "import django; print('Django', django.get_version())"
          python -c "import pytest_django; print('pytest-django installed')"
          python -m pytest --version

      - name: Check Django configuration and migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "false"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Check Python syntax and undefined names
        run: |
          python -m flake8 backend scripts \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run pytest
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "false"
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: backend
        run: python -m pytest backend -v
