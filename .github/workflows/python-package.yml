# Author: Stan Zvenigorodskiy | DevOps Lab Inc. | https://DevOpsLabInc.com
# Purpose: Enforces security gates for workflows, infrastructure-as-code, secrets,
# Python dependencies and source, Django deployment settings, and npm dependencies.
#
# This workflow complements:
# - codeql.yml: Python and JavaScript/TypeScript CodeQL analysis
# - dependency-review.yml: pull-request dependency and license review
# - python-package.yml: tests, 90% coverage, linting, type-checking, and frontend build
# - terraform.yml: Terraform fmt/validate, TFLint, Go contract tests, plan, and deployment

name: Security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays at 06:41 UTC.
    - cron: "41 6 * * 2"
  workflow_dispatch:

# Default every job to read-only repository access. The Checkov job receives
# security-events: write only because it uploads SARIF findings.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  workflow-validation:
    name: Workflow security validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install workflow validator
        run: python -m pip install "PyYAML>=6.0,<7.0"

      - name: Validate workflows and approved action versions
        run: python scripts/validate_workflows.py

      - name: Validate security remediation invariants
        run: python scripts/validate_security_remediation.py

      - name: Validate documentation links
        run: python scripts/validate_documentation_links.py

      - name: Validate Python and shell security automation
        run: |
          python -m compileall -q scripts
          bash -n scripts/run_full_tests.sh
          bash -n scripts/security_scan.sh
          find terraform/scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

  checkov:
    name: Checkov policy scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement security-requirements.txt
          checkov --version

      # Capture the scanner exit code so reports are uploaded before the policy
      # gate is enforced. Unlike --soft-fail, an unsuppressed finding cannot pass.
      #
      # Approved narrow suppressions:
      # - CKV_GHA_5/6: action tags are governed by scripts/validate_workflows.py.
      # - CKV_GHA_7: terraform.yml intentionally uses typed manual inputs. The
      #   operation is a fixed choice, auto_destroy is boolean, and the delay is
      #   passed through an environment variable and validated as an integer.
      # - CKV_SECRET_6 only for README_FUTURE.md: the documentation-only channel
      #   list is a confirmed entropy false positive. Secret scanning remains
      #   enabled for every other check and every other repository file.
      - name: Run complete Checkov scan and create reports
        id: checkov
        shell: bash
        run: |
          set +e
          set -o pipefail

          checkov --directory . \
            --framework terraform cloudformation kubernetes helm bicep arm serverless dockerfile github_actions openapi secrets \
            --enable-secret-scan-all-files \
            --skip-path 'docs/' \
            --skip-path 'screenshots/' \
            --skip-path 'validation/' \
            --skip-path 'node_modules/' \
            --skip-path '__pycache__/' \
            --skip-path '\.env\.example$' \
            --skip-check 'CKV_GHA_5,CKV_GHA_6,CKV_GHA_7,CKV_SECRET_6:.*README_FUTURE\.md$' \
            --compact \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif \
            2>&1 | tee checkov-cli.txt

          status="${PIPESTATUS[0]}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Checkov reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkov-results
          path: |
            checkov.sarif
            checkov-cli.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Checkov findings to GitHub Security
        if: >-
          always() &&
          hashFiles('checkov.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Enforce complete Checkov policy gate
        if: steps.checkov.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail

          echo "Checkov found an unsuppressed policy violation or could not complete."

          if [[ -f checkov-cli.txt ]]; then
            echo "::group::Checkov failed findings"
            grep -B 3 -A 10 -E 'FAILED for resource|ERROR|Error:' checkov-cli.txt || true
            echo "::endgroup::"
          fi

          echo "Download the checkov-results artifact for the complete CLI and SARIF reports."
          exit 1

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            backend/requirements-dev.txt
            security-requirements.txt

      - name: Install application and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement security-requirements.txt
          python -m pip check

      # requirements.txt includes the backend runtime and development/test
      # dependency sets, so the audit covers both application and CI packages.
      - name: Audit Python dependencies
        id: pip-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --desc \
            --format json \
            --output pip-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-results
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Python dependency audit
        if: steps.pip-audit.outputs.status != '0'
        run: |
          echo "pip-audit found a vulnerable dependency or could not complete."
          exit 1

  python-sast:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement security-requirements.txt
          bandit --version

      - name: Scan Python application and automation source
        id: bandit
        shell: bash
        run: |
          set +e
          bandit --recursive backend scripts \
            --exclude backend/gigs/tests,backend/integrations/vibesmeet/tests,backend/gigs/migrations \
            --severity-level high \
            --confidence-level medium \
            --format json \
            --output bandit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-results
          path: bandit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Bandit findings
        if: steps.bandit.outputs.status != '0'
        run: |
          echo "Bandit found a high-severity issue or could not complete."
          exit 1

  django-deployment-check:
    name: Django deployment security check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt
          python -m pip check

      - name: Generate deployment-check secret
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print(f"SECRET_KEY={secrets.token_urlsafe(64)}")
          PY

      - name: Run Django deployment checks
        working-directory: backend
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
          AWS_XRAY_ENABLED: "true"
          AWS_XRAY_TRACING_NAME: demand-gig-backend-ci
        run: |
          python manage.py check --deploy --fail-level WARNING
          python - <<'PY'
          import django
          from django.test import Client

          django.setup()
          response = Client().get(
              "/api/health/",
              HTTP_HOST="example.com",
              secure=True,
          )
          if response.status_code != 200:
              raise SystemExit(
                  f"Production health smoke test returned HTTP {response.status_code}"
              )
          PY

  frontend-dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect committed npm lockfile
        id: npm-lock
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using committed frontend/package-lock.json."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/package-lock.json is missing. CI will generate temporary dependency metadata for this audit. Commit the generated lockfile for reproducible builds."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Prefer the immutable dependency tree from package-lock.json. The
      # fallback keeps security scanning operational for older branches while
      # generating a lockfile that can be downloaded and committed afterward.
      # Resolution is allowed to finish non-zero so the workflow can always
      # publish a diagnostic JSON artifact before enforcing the failure.
      - name: Resolve frontend dependency tree
        id: npm-resolve
        shell: bash
        run: |
          set +e
          if [[ "${{ steps.npm-lock.outputs.present }}" == "true" ]]; then
            npm ci --ignore-scripts --no-fund --no-audit
          else
            npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          fi
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [[ "$status" -ne 0 ]]; then
            NPM_RESOLUTION_STATUS="$status" node <<'NODE'
          const fs = require("node:fs");
          const report = {
            auditReportVersion: 2,
            error: {
              code: "DEPENDENCY_RESOLUTION_FAILED",
              summary: "npm could not resolve the frontend dependency tree.",
              detail: `npm exited with status ${process.env.NPM_RESOLUTION_STATUS}. Review the preceding workflow log.`
            }
          };
          fs.writeFileSync("../npm-audit.json", `${JSON.stringify(report, null, 2)}\n`);
          NODE
          fi
          exit 0

      - name: Upload generated npm lockfile
        if: steps.npm-lock.outputs.present != 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Audit production dependencies
        id: npm-audit
        if: steps.npm-resolve.outputs.status == '0'
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > ../npm-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-results
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce dependency resolution and vulnerability policy
        shell: bash
        run: |
          if [[ "${{ steps.npm-resolve.outputs.status }}" != "0" ]]; then
            echo "npm could not resolve the frontend dependency tree."
            exit 1
          fi

          if [[ "${{ steps.npm-audit.outputs.status }}" != "0" ]]; then
            echo "npm audit found a HIGH or CRITICAL production vulnerability or could not complete."
            exit 1
          fi

          echo "Frontend dependencies resolved and passed the production vulnerability policy."

  security-gate:
    name: Security gate
    if: always()
    needs:
      - workflow-validation
      - checkov
      - python-dependency-audit
      - python-sast
      - django-deployment-check
      - frontend-dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKFLOW_VALIDATION: ${{ needs.workflow-validation.result }}
      CHECKOV: ${{ needs.checkov.result }}
      PYTHON_DEPENDENCIES: ${{ needs.python-dependency-audit.result }}
      BANDIT: ${{ needs.python-sast.result }}
      DJANGO_DEPLOYMENT: ${{ needs.django-deployment-check.result }}
      NPM_AUDIT: ${{ needs.frontend-dependency-audit.result }}

    steps:
      - name: Summarize security results
        shell: bash
        run: |
          printf '%-28s %s\n' \
            "Workflow validation" "$WORKFLOW_VALIDATION" \
            "Checkov" "$CHECKOV" \
            "Python dependency audit" "$PYTHON_DEPENDENCIES" \
            "Bandit" "$BANDIT" \
            "Django deployment check" "$DJANGO_DEPLOYMENT" \
            "npm audit" "$NPM_AUDIT"

          for result in \
            "$WORKFLOW_VALIDATION" \
            "$CHECKOV" \
            "$PYTHON_DEPENDENCIES" \
            "$BANDIT" \
            "$DJANGO_DEPLOYMENT" \
            "$NPM_AUDIT"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more required security checks failed."
              exit 1
            fi
          done

          echo "All required security checks passed."
