# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  workflow-validation:
    name: Workflow security validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install workflow validator
        run: python -m pip install "PyYAML>=6.0,<7.0"

      - name: Validate workflows and approved action versions
        run: python scripts/validate_workflows.py

      - name: Validate security shell scripts
        run: |
          bash -n scripts/run_full_tests.sh
          bash -n scripts/security_scan.sh

  checkov:
    name: Checkov policy scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement security-requirements.txt
          checkov --version

      - name: Run full Checkov scan and create SARIF
        run: |
          checkov --directory . \
            --framework terraform cloudformation kubernetes helm bicep arm serverless dockerfile github_actions openapi secrets \
            --skip-path '(^|/)docs/' \
            --skip-path '(^|/)screenshots/' \
            --skip-path '(^|/)validation/' \
            --skip-path '(^|/)node_modules/' \
            --skip-path '(^|/)__pycache__/' \
            --skip-path '(^|/)\.env\.example$' \
            --skip-check CKV_GHA_5,CKV_GHA_6 \
            --compact \
            --soft-fail \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif

      - name: Enforce Checkov Docker, workflow, and secret policies
        run: |
          checkov --directory . \
            --framework dockerfile github_actions secrets \
            --enable-secret-scan-all-files \
            --skip-path '(^|/)docs/' \
            --skip-path '(^|/)screenshots/' \
            --skip-path '(^|/)validation/' \
            --skip-path '(^|/)node_modules/' \
            --skip-path '(^|/)__pycache__/' \
            --skip-path '(^|/)\.env\.example$' \
            --skip-check CKV_GHA_5,CKV_GHA_6 \
            --compact

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkov-results
          path: checkov.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Checkov findings to GitHub Security
        if: >-
          always() &&
          hashFiles('checkov.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            security-requirements.txt

      - name: Install application and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt
          python -m pip install --requirement security-requirements.txt
          python -m pip check

      - name: Audit Python dependencies
        id: pip-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --requirement backend/requirements.txt \
            --strict \
            --desc \
            --format json \
            --output pip-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-results
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Python dependency audit
        if: steps.pip-audit.outputs.status != '0'
        run: |
          echo "pip-audit found a vulnerable dependency or could not complete."
          exit 1

  python-sast:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: security-requirements.txt

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement security-requirements.txt
          bandit --version

      - name: Scan Python source
        id: bandit
        shell: bash
        run: |
          set +e
          bandit --recursive backend \
            --exclude backend/gigs/tests,backend/integrations/vibesmeet/tests,backend/gigs/migrations \
            --severity-level high \
            --confidence-level medium \
            --format json \
            --output bandit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-results
          path: bandit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Bandit findings
        if: steps.bandit.outputs.status != '0'
        run: |
          echo "Bandit found a high-severity issue or could not complete."
          exit 1

  django-deployment-check:
    name: Django deployment security check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt
          python -m pip check

      - name: Generate deployment-check secret
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print(f"SECRET_KEY={secrets.token_urlsafe(64)}")
          PY

      - name: Run Django deployment checks
        working-directory: backend
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

  frontend-dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve dependency metadata without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Audit production dependencies
        id: npm-audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > ../npm-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-results
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce high and critical npm vulnerabilities
        if: steps.npm-audit.outputs.status != '0'
        run: |
          echo "npm audit found a HIGH or CRITICAL production vulnerability or could not complete."
          exit 1

  security-gate:
    name: Security gate
    if: always()
    needs:
      - workflow-validation
      - checkov
      - python-dependency-audit
      - python-sast
      - django-deployment-check
      - frontend-dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKFLOW_VALIDATION: ${{ needs.workflow-validation.result }}
      CHECKOV: ${{ needs.checkov.result }}
      PYTHON_DEPENDENCIES: ${{ needs.python-dependency-audit.result }}
      BANDIT: ${{ needs.python-sast.result }}
      DJANGO_DEPLOYMENT: ${{ needs.django-deployment-check.result }}
      NPM_AUDIT: ${{ needs.frontend-dependency-audit.result }}

    steps:
      - name: Summarize security results
        shell: bash
        run: |
          printf '%-28s %s\n' \
            "Workflow validation" "$WORKFLOW_VALIDATION" \
            "Checkov" "$CHECKOV" \
            "Python dependency audit" "$PYTHON_DEPENDENCIES" \
            "Bandit" "$BANDIT" \
            "Django deployment check" "$DJANGO_DEPLOYMENT" \
            "npm audit" "$NPM_AUDIT"

          for result in \
            "$WORKFLOW_VALIDATION" \
            "$CHECKOV" \
            "$PYTHON_DEPENDENCIES" \
            "$BANDIT" \
            "$DJANGO_DEPLOYMENT" \
            "$NPM_AUDIT"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more required security checks failed."
              exit 1
            fi
          done

          echo "All required security checks passed."
