# Purpose: Serves the compiled React SPA as an unprivileged container and provides a health endpoint.

# Define the single HTTP virtual server used by the frontend container.
server {
    # Listen on the non-privileged port exposed by the unprivileged Nginx image.
    listen 8080;
    server_name _;

    # Serve files copied into the image by the frontend build stage.
    root /usr/share/nginx/html;
    index index.html;

    # Serve real assets directly and fall back to index.html for client-side React routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Return a dependency-free response for Docker and load-balancer health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
